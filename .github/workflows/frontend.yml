name: Frontend Checks

on:
  pull_request:
    paths:
      - "ant-design-pro/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "ant-design-pro/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Vitest, TypeScript, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ant-design-pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run tsc

      - name: Build production bundle
        run: npm run build
